name: Cache Cargo and native build outputs
description: >-
  Restore Cargo dependencies and Sipp native build outputs for a CI job.

inputs:
  key-prefix:
    description: >-
      Cache-key prefix identifying the CI job, operating system, and
      architecture.
    required: true

runs:
  using: composite
  steps:
    - name: Restore Cargo and native build outputs
      uses: actions/cache@v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          .build/cargo
          .build/cmake
          .build/c
        key: ${{ inputs.key-prefix }}-ninja-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'apps/**/Cargo.toml', 'bindings/**/Cargo.toml', 'crates/**/Cargo.toml', 'examples/**/Cargo.toml', 'lib/**/Cargo.toml', 'tools/**/Cargo.toml', 'xtask/Cargo.toml') }}
        restore-keys: |
          ${{ inputs.key-prefix }}-ninja-v1-
