name: Docs

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release sipp packages"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.3

jobs:
  build:
    name: Build mdBook
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo installs
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: docs-${{ runner.os }}-${{ env.MDBOOK_VERSION }}

      - name: Build documentation
        run: cargo xtask docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: book

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
